services:
  postgres:
    image: postgres:16
    user: "999:999"
    container_name: postgres_ecommerce
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "1900:5432"
    command: ["postgres","-c", "wal_level=logical"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 30s    # default Docker è solo 10s
    stop_signal: SIGTERM       # segnale corretto per Postgres
    networks:
      - pipeline

  kafka:
    image: confluentinc/cp-kafka:7.8.3
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_KRAFT_MODE: 'true'
      CLUSTER_ID: 'MkU2MTAxODhDRTM0NDcyOQ'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker, controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks:
      - pipeline


# --- AGGIUNTA DEBEZIUM CONNECT ---
  debezium:
    image: quay.io/debezium/connect:2.5
    container_name: debezium
    ports:
      - "8083:8083" # Porta per le API REST di configurazione
    environment:
      - BOOTSTRAP_SERVERS=kafka:29092
      - GROUP_ID=1
      - CONFIG_STORAGE_TOPIC=my_connect_configs
      - OFFSET_STORAGE_TOPIC=my_connect_offsets
      - STATUS_STORAGE_TOPIC=my_connect_statuses
      - KEY_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - VALUE_CONVERTER=org.apache.kafka.connect.json.JsonConverter
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: on-failure
    networks:
      - pipeline

  pgadmin:
    image: dpage/pgadmin4@sha256:2f4ce946ddf8360680d7eff4eaba1d91859eb6b4003e6623bad5c63a322c2f4d
    container_name: pgadmin_ecommerce
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - pipeline

  # L'app che genera gli eventi che la pipeline CDC cattura. Prima viveva
  # fuori dal compose (avviata a mano da IDE/gradle sull'host) — dentro la
  # rete `pipeline` così Debezium/Kafka/Prometheus la raggiungono per nome
  # servizio invece che via host.docker.internal.
  ecommerce-backend:
    build:
      context: ./e-commerce/backend
    container_name: ecommerce_backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8085:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pipeline

  kafka-ui:
    image: provectuslabs/kafka-ui:latest@sha256:8f2ff02d64b0a7a2b71b6b3b3148b85f66d00ec20ad40c30bdcd415d46d31818
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - pipeline

  spark-master:
    build: .
    image: my-spark-delta-4:latest
    container_name: spark-master
    user: root
    environment:
      - SPARK_MASTER_HOST=spark-master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - PATH=/opt/spark/bin:$PATH
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PYTHONPATH=/opt/spark
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8081:8080"
      - "7077:7077"
    volumes:
      - ./spark_apps:/opt/spark/apps
      - ./data/spark_master:/opt/spark/work-dir
      - spark_checkpoints:/opt/spark/checkpoints
      - ./spark_apps:/opt/spark/spark_apps
    networks:
      - pipeline

  spark-worker:
    build: .
    image: my-spark-delta-4:latest
    container_name: spark-worker
    user: root
    depends_on:
      - spark-master
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=1G
      # IMPORTANTE: Il worker deve poter risolvere il nome del master
      - SPARK_WORKER_WEBUI_PORT=8082
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PYTHONPATH=/opt/spark
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    volumes:
      - ./spark_apps:/opt/spark/apps
      - ./data/spark_worker:/opt/spark/work-dir
      - ./spark_apps:/opt/spark/spark_apps
      - spark_checkpoints:/opt/spark/checkpoints
    networks:
      - pipeline

  prometheus:
    image: prom/prometheus:latest@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - pipeline

  grafana:
    image: grafana/grafana:latest@sha256:3fd54ae1214669f8355f065ec9f6445d5279a3d77095ab048ca045685272429b
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - pipeline

  dbt:
    image: ghcr.io/dbt-labs/dbt-trino:1.7.0 # Usa l'immagine ufficiale per Trino
    container_name: dbt_transform
    volumes:
      - ./dbt_project:/usr/app # I tuoi modelli, macro e profili dbt
    environment:
      - DBT_PROFILES_DIR=/usr/app
    profiles: [ "tools" ] # Opzionale: per non avviarlo sempre con 'up'
    networks:
      - pipeline
    depends_on:
      - trino

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: minio
    ports:
      - "9000:9000"   # API S3-compatible
      - "9001:9001"   # Console web
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pipeline

  # Crea i bucket automaticamente all'avvio
  minio-init:
    image: minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./minio-policies:/policies   # cartella con i tuoi JSON
    entrypoint: >
      /bin/sh -c "
        set -e;
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
        mc mb --ignore-existing local/lakehouse;
        mc mb --ignore-existing local/spark-checkpoints;
        mc ilm import local/lakehouse < /policies/lakehouse_lifecycle.json;
      "
    networks:
      - pipeline

  trino:
    image: trinodb/trino:435
    container_name: trino
    ports:
      - "8084:8084"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - ./trino:/etc/trino
      - trino_data:/data/trino
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - pipeline


  trino-init:
    image: trinodb/trino:435
    container_name: trino-init
    depends_on:
      - trino
    volumes:
      - ./trino/init.sql:/init.sql
    entrypoint: >
      /bin/sh -c "
        sleep 20;
        trino --server http://trino:8084 --catalog delta --schema default -f /init.sql;
        exit 0;
      "
    networks:
      - pipeline


  great-expectations:
    image: my-spark-delta-4:latest
    container_name: great-expectations
    user: root
    environment:
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
    volumes:
      - ./great_expectations:/app/great_expectations
    depends_on:
      minio:
        condition: service_healthy
    command: >
      /opt/spark/bin/spark-submit
      /app/great_expectations/validate.py
    networks:
      - pipeline

networks:
  pipeline:
    driver: bridge

volumes:
  postgres_data:
  kafka_data:
  minio_data:
  grafana_data:
  spark_checkpoints:
  trino_data:
