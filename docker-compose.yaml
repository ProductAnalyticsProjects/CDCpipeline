services:
  postgres:
    image: postgres:16
    container_name: postegres_bioparco
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=inventory
    ports:
      - "1900:5432"
    command: ["postgres","-c", "wal_level=logical"]
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  kafka:
    image: confluentinc/cp-kafka:7.8.3
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_KRAFT_MODE: 'true'

      CLUSTER_ID: 'MkU2MTAxODhDRTM0NDcyOQ'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker, controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - ./data/kafka:/var/lib/kafka/data

# --- AGGIUNTA DEBEZIUM CONNECT ---
  debezium:
    image: quay.io/debezium/connect:2.5
    container_name: debezium
    depends_on:
      - kafka
      - postgres
    ports:
      - "8083:8083" # Porta per le API REST di configurazione
    environment:
      - BOOTSTRAP_SERVERS=kafka:29092
      - GROUP_ID=1
      - CONFIG_STORAGE_TOPIC=my_connect_configs
      - OFFSET_STORAGE_TOPIC=my_connect_offsets
      - STATUS_STORAGE_TOPIC=my_connect_statuses
      - KEY_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - VALUE_CONVERTER=org.apache.kafka.connect.json.JsonConverter

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_bioparco
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  spark-master:
    build: .
    image: my-spark-delta-4:latest
    container_name: spark-master
    user: root
    environment:
      - SPARK_MASTER_HOST=spark-master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8081:8080"
      - "7077:7077"
    volumes:
      - ./spark_apps:/opt/spark/apps
      - ./data/spark_master:/opt/spark/work-dir
      - ./spark_checkpoints:/opt/spark/checkpoints

  spark-worker:
    build: .
    image: my-spark-delta-4:latest
    container_name: spark-worker
    user: root
    depends_on:
      - spark-master
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_CORES=1
      - SPARK_WORKER_MEMORY=1G
      # IMPORTANTE: Il worker deve poter risolvere il nome del master
      - SPARK_WORKER_WEBUI_PORT=8081
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    volumes:
      - ./spark_apps:/opt/spark/apps
      - ./data/spark_worker:/opt/spark/work-dir
      - ./spark_checkpoints:/opt/spark/checkpoints

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./data/grafana:/var/lib/grafana
    depends_on:
      - prometheus

  dbt:
      image: ghcr.io/dbt-labs/dbt-postgres:1.7.0 # Usa l'immagine ufficiale per Postgres
      container_name: dbt_transform
      volumes:
        - ./dbt_project:/usr/app # I tuoi modelli, macro e profili dbt
      environment:
        - DBT_PROFILES_DIR=/usr/app
        - DBT_POSTGRES_HOST=postgres
        - DBT_POSTGRES_USER=user
        - DBT_POSTGRES_PW=password
        - DBT_POSTGRES_DB=inventory
        - DBT_POSTGRES_SCHEMA=public
      profiles: [ "tools" ] # Opzionale: per non avviarlo sempre con 'up'
