services:
  postgres:
    image: postgres:16
    user: "999:999"
    container_name: postegres_bioparco
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "1900:5432"
    command: ["postgres","-c", "wal_level=logical"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d inventory"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 30s    # default Docker è solo 10s
    stop_signal: SIGTERM       # segnale corretto per Postgres
    networks:
      - pipeline

  kafka:
    image: confluentinc/cp-kafka:7.8.3
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_KRAFT_MODE: 'true'
      CLUSTER_ID: 'MkU2MTAxODhDRTM0NDcyOQ'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker, controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks:
      - pipeline


# --- AGGIUNTA DEBEZIUM CONNECT ---
  debezium:
    image: quay.io/debezium/connect:2.5
    container_name: debezium
    ports:
      - "8083:8083" # Porta per le API REST di configurazione
    environment:
      - BOOTSTRAP_SERVERS=kafka:29092
      - GROUP_ID=1
      - CONFIG_STORAGE_TOPIC=my_connect_configs
      - OFFSET_STORAGE_TOPIC=my_connect_offsets
      - STATUS_STORAGE_TOPIC=my_connect_statuses
      - KEY_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - VALUE_CONVERTER=org.apache.kafka.connect.json.JsonConverter
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: on-failure
    networks:
      - pipeline

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_bioparco
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - pipeline

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - pipeline

  spark-master:
    build: .
    image: my-spark-delta-4:latest
    container_name: spark-master
    user: root
    environment:
      - SPARK_MASTER_HOST=spark-master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_SUBMIT_OPTS=--packages io.delta:delta-spark_2.12:3.0.0
      - PATH=/opt/spark/bin:$PATH
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8081:8080"
      - "7077:7077"
    volumes:
      - ./spark_apps:/opt/spark/apps
      - ./data/spark_master:/opt/spark/work-dir
      - spark_checkpoints:/opt/spark/checkpoints
    networks:
      - pipeline

  spark-worker:
    build: .
    image: my-spark-delta-4:latest
    container_name: spark-worker
    user: root
    depends_on:
      - spark-master
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_CORES=1
      - SPARK_WORKER_MEMORY=1G
      # IMPORTANTE: Il worker deve poter risolvere il nome del master
      - SPARK_WORKER_WEBUI_PORT=8082
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    volumes:
      - ./spark_apps:/opt/spark/apps
      - ./data/spark_worker:/opt/spark/work-dir
      - spark_checkpoints:/opt/spark/checkpoints
    networks:
      - pipeline

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - pipeline

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - pipeline

  dbt:
    image: ghcr.io/dbt-labs/dbt-trino:1.7.0 # Usa l'immagine ufficiale per Trino
    container_name: dbt_transform
    volumes:
      - ./dbt_project:/usr/app # I tuoi modelli, macro e profili dbt
    environment:
      - DBT_PROFILES_DIR=/usr/app
      - DBT_POSTGRES_HOST=postgres
      - DBT_POSTGRES_USER=${DBT_POSTGRES_USER}
      - DBT_POSTGRES_PW=${POSTGRES_PASSWORD}
      - DBT_POSTGRES_DB=${DBT_POSTGRES_DB}
      - DBT_POSTGRES_SCHEMA=public
    profiles: [ "tools" ] # Opzionale: per non avviarlo sempre con 'up'
    networks:
      - pipeline
    depends_on:
      - trino

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"   # API S3-compatible
      - "9001:9001"   # Console web
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pipeline

  # Crea i bucket automaticamente all'avvio
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./minio-policies:/policies   # cartella con i tuoi JSON
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/lakehouse;
        mc mb --ignore-existing local/spark-checkpoints;
        mc ilm import local/lakehouse < /policies/lakehouse_lifecycle.json;
        exit 0;
      "
    networks:
      - pipeline

  trino:
    image: trinodb/trino:435
    container_name: trino
    ports:
      - "8084:8084"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - ./trino:/etc/trino
      - trino_data:/data/trino
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - pipeline


  trino-init:
    image: trinodb/trino:435
    container_name: trino-init
    depends_on:
      - trino
    volumes:
      - ./trino/init.sql:/init.sql
    entrypoint: >
      /bin/sh -c "
        sleep 20;
        trino --server http://trino:8084 --catalog delta --schema default -f /init.sql;
        exit 0;
      "
    networks:
      - pipeline


  great-expectations:
    image: my-spark-delta-4:latest
    container_name: great-expectations
    user: root
    environment:
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
    volumes:
      - ./great_expectations:/app/great_expectations
    depends_on:
      minio:
        condition: service_healthy
    command: >
      /opt/spark/bin/spark-submit
      /app/great_expectations/validate.py
    networks:
      - pipeline

networks:
  pipeline:
    driver: bridge

volumes:
  postgres_data:
  kafka_data:
  minio_data:
  grafana_data:
  spark_checkpoints:
  trino_data:
