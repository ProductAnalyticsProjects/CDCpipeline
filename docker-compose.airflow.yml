# Overlay Airflow per il progetto CDC.
#
# File separato (non un'unica modifica dentro docker-compose.yaml) perché
# Airflow è un componente opzionale: chi vuole solo la pipeline dati core
# continua con `docker compose up`; chi vuole anche l'orchestrazione fa:
#
#   docker compose -f docker-compose.yaml -f docker-compose.airflow.yml up -d
#
# Metadata DB dedicato (airflow-postgres) invece di riusare il "postgres"
# applicativo: best practice standard Airflow — mescolare i metadati dello
# scheduler (DAG run, task instance, log) con i dati di business del progetto
# CDC renderebbe i due sistemi accoppiati per errore (es. un `dbt` che gira
# contro lo schema sbagliato, o un restore del DB applicativo che si porta
# dietro lo stato dello scheduler).
services:
  airflow-postgres:
    image: postgres:16
    container_name: airflow_postgres
    environment:
      - POSTGRES_USER=${AIRFLOW_DB_USER}
      - POSTGRES_PASSWORD=${AIRFLOW_DB_PASSWORD}
      - POSTGRES_DB=${AIRFLOW_DB_NAME}
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER} -d ${AIRFLOW_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pipeline

  # Job one-shot: inizializza lo schema del metadata DB e crea l'utente admin.
  # Esce con codice 0 a fine lavoro (non è un servizio long-running).
  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: airflow_init
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-postgres/${AIRFLOW_DB_NAME}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      SPARK_MASTER_UI: http://spark-master:8080
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    entrypoint: /bin/bash
    command:
      - -c
      - >
        airflow db migrate &&
        airflow users create
        --username ${AIRFLOW_ADMIN_USER}
        --password ${AIRFLOW_ADMIN_PASSWORD}
        --firstname admin --lastname admin
        --role Admin
        --email ${AIRFLOW_ADMIN_EMAIL}
    networks:
      - pipeline

  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: airflow_webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    ports:
      - "8090:8080"   # 8080 già usato da kafka-ui, 8081 da spark-master
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      # Necessario perché i DAG lanciano `docker compose run ...` sull'host.
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/opt/airflow/project   # working dir per i comandi docker compose
    command: webserver
    networks:
      - pipeline

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes:
      - ./dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/opt/airflow/project
    working_dir: /opt/airflow/project
    command: scheduler
    networks:
      - pipeline

volumes:
  airflow_postgres_data:
  airflow_logs:
